name = "buywardogshacks-com"
main = "workers/site.js"
compatibility_date = "2026-09-12"

[build]
command = "npm run build"

[[routes]]
pattern = "buywardogshacks.com"
custom_domain = true

[[routes]]
pattern = "www.buywardogshacks.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
